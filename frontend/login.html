<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streametrics | Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <header class="navbar" style="background:transparent !important; border:none;">
    <div class="nav-left"><div class="logo">Streametrics</div></div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1>Sign In</h1>
      <p class="subtitle">Stream your universe</p>
      <form id="loginForm" class="auth-form">
        <input id="username" name="username" type="text" placeholder="Username" required autocomplete="off" />
        <input id="password" name="password" type="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
      </form>
      <p id="loginMessage" class="message"></p>
      <p class="hint">Use credentials: <b>9341806005 / 9341806005</b></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
